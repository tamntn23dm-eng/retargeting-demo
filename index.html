  <h1>Ưu đãi MoMo cho người dùng mới</h1>
  <p>Trang demo dùng để kiểm tra theo dõi hành vi cho kế hoạch nhắm chọn lại (Retargeting). Bấm nút bên dưới để gửi sự kiện bấm tải ứng dụng.</p>

  <a id="btn-download" href="https://momo.vn" target="_blank" rel="noopener">Tải ứng dụng MoMo</a>
  <div id="status"></div>

  <script>
    // Gửi sự kiện khi bấm nút "Tải ứng dụng"
    document.getElementById('btn-download').addEventListener('click', function () {
      // Gửi sự kiện tùy chỉnh về Meta Pixel
      fbq('trackCustom', 'ClickDownload');
      // Gửi sự kiện cho Google Tag Manager (từ đó chuyển sang GA4)
      window.dataLayer.push({ event: 'click_download' });
      document.getElementById('status').textContent = '';
    });
  </script>
